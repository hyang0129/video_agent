[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-agent"
version = "0.1.0"
description = "Multi-agent AI video content pipeline"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "langchain>=0.3.0,<2.0",
    "langchain-community>=0.3.0,<1.0",
    "langchain-core>=0.3.0,<1.0",
    "langchain-google-genai>=2.0.0",
    "langchain-anthropic>=0.3.0",
    "python-dotenv>=1.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.1.1",
    "youtube-transcript-api>=0.6.0",
    "google-auth-oauthlib>=1.1.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "requests-cache>=1.1.0",
    "isodate>=0.6.1",
    "pydantic>=2.0.0",
    "tqdm>=4.66.0",
    "loguru>=0.7.0",
    "elevenlabs>=0.2.0",
    "mcp>=1.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "trustme>=0.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
trends = ["pytrends>=4.9.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
video-agent = "video_agent.main:main"
video-agent-mcp = "video_agent.mcp.video_agent_server:main"

[tool.hatch.build.targets.wheel]
packages = ["video_agent"]
